<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>直播 录制管理 - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <style>
        :root {
            color-scheme: light dark;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #d1d5db;
            --input: #ffffff;
            --input-border: #cbd5e1;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --shadow: rgba(15, 23, 42, .12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --card: #1f2937;
                --text: #e5e7eb;
                --muted: #9ca3af;
                --border: #374151;
                --input: #111827;
                --input-border: #4b5563;
                --primary: #2563eb;
                --primary-hover: #1d4ed8;
                --error-bg: #7f1d1d;
                --error-text: #fecaca;
                --shadow: rgba(0, 0, 0, .35);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        。card {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px var(--shadow);
        }

        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            background: var(--input);
            color: var(--text);
            outline: none;
        }

        input:focus { border-color: #60a5fa; }

        button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: var(--primary-hover); }

        .error {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>直播 录制管理</h1>
        <p>管理员可删除文件，游客只能下载。</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label>用户名</label>
            <input name="username" autocomplete="username" required>

            <label>密码</label>
            <input name="password" type="password" autocomplete="current-password" required>

            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
