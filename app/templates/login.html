<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>QQ直播 录制管理 - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        p {
            margin: 0 0 22px;
            color: #9ca3af;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #d1d5db;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid #4b5563;
            border-radius: 12px;
            background: #111827;
            color: #f9fafb;
            outline: none;
        }

        input:focus {
            border-color: #60a5fa;
        }

        button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #7f1d1d;
            color: #fecaca;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>QQ直播 录制管理</h1>
        <p>登录后管理录制完成的视频文件。</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label>用户名</label>
            <input name="username" autocomplete="username" required>

            <label>密码</label>
            <input name="password" type="password" autocomplete="current-password" required>

            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
